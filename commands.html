<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <!-- Scripts, connections, frames and images may come only from this
         add-in's own files and Microsoft Office addresses, so the script
         cannot send data to any other site. Version 1.1.0 allowed only
         appsforoffice.microsoft.com, which stopped Office.js starting in
         Outlook for Mac. If the button ever fails to load, check this first. -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https://*.microsoft.com https://*.office.com https://*.office.net https://*.officeapps.live.com; connect-src 'self' https://*.microsoft.com https://*.office.com https://*.office.net https://*.officeapps.live.com https://*.oaspapps.com; frame-src 'self' https://*.microsoft.com https://*.office.com https://*.office.net https://*.oaspapps.com; img-src 'self' data: blob: https://*.microsoft.com https://*.office.net; style-src 'self' 'unsafe-inline'; font-src 'self' data: https://*.office.net; worker-src 'self' blob:" />
    <title>Email Composer</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script src="font-transform.js"></script>
    <script src="commands.js"></script>
  </head>
  <body></body>
</html>
