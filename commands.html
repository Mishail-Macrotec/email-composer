<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <!-- Only this add-in's own files and Microsoft's Office.js may load; the
         script cannot send data anywhere else. Office.js in Outlook for Mac
         also loads MicrosoftAjax.js from ajax.aspnetcdn.com, so that host is
         allowed too. If the button ever fails to load in Outlook, check this
         policy first. -->
    <meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://appsforoffice.microsoft.com https://ajax.aspnetcdn.com; connect-src 'self' https://appsforoffice.microsoft.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'" />
    <title>Email Composer</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
    <script src="font-transform.js"></script>
    <script src="commands.js"></script>
  </head>
  <body></body>
</html>
